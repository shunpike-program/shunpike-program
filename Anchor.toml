[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

# Placeholder id until the first `anchor keys sync` after the deploy keypair is
# generated (P3). The same id is declared in programs/shunpike_stream/src/lib.rs —
# keys sync rewrites both together.
[programs.localnet]
shunpike_stream = "GooHiyMEYnVAUkajiAc33fA9rQjF5K8ZvFojHNzhrShg"

[programs.devnet]
shunpike_stream = "GooHiyMEYnVAUkajiAc33fA9rQjF5K8ZvFojHNzhrShg"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# The whole suite is Rust (unit + LiteSVM integration) — no ts-mocha layer.
# `anchor build` must run first so tests can load target/deploy/shunpike_stream.so.
test = "cargo test"
