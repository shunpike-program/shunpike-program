[workspace]
members = ["programs/*"]
resolver = "2"

# Solana program builds want maximum determinism + overflow safety. overflow-checks
# stays ON in release: silent wraparound in money math is the one bug class we can
# eliminate at the compiler level for near-zero compute cost.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
